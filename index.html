<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Mebli na Wymiar • White-Label Demo</title>
    <style>
      body {
        margin: 0;
        padding: 40px 16px;
        background-color: #f5f5f4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .demo-header {
        max-width: 42rem;
        margin: 0 auto 24px auto;
        text-align: center;
      }
      .demo-badge {
        display: inline-block;
        padding: 4px 12px;
        background-color: #e7e5e4;
        color: #44403c;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .demo-title {
        margin: 0 0 8px 0;
        font-size: 24px;
        color: #1c1917;
      }
      .demo-desc {
        margin: 0;
        font-size: 14px;
        color: #78716c;
      }
    </style>
    <!-- Przykładowa konfiguracja White-Label (obsługuje też parametry z URL: ?firma=...&kolor=...) -->
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const companyParam = urlParams.get('firma') || urlParams.get('company') || "Kuchnie na wymiar";
      const rawColor = urlParams.get('kolor') || urlParams.get('color') || "92400e";
      const colorParam = rawColor.startsWith('#') ? rawColor : '#' + rawColor;
      const priceParam = Number(urlParams.get('cena') || urlParams.get('price')) || 3300;
      const webhookParam = urlParams.get('webhook') || "";

      window.KitchenCalcConfig = {
        companyName: companyParam,
        companyPhone: "+48 600 123 456",
        privacyPolicyUrl: "/polityka-prywatnosci",
        consentVersion: "1.0",
        primaryColor: colorParam,
        basePricePerMeter: priceParam,
        webhookUrl: webhookParam || "https://script.google.com/macros/s/AKfycbz-3Ax0t0RK-_A6ZX8ZWiM1Zp6Foh6JPHpbg6rqbwWVnk4fNNgrkjo7ycHIXUSOSTz4/exec" // Puste = tryb symulacji w konsoli przeglądarki
      };
    </script>
  </head>
  <body>
    <div class="demo-header">
      <span class="demo-badge">Środowisko Testowe (Web Component Preview)</span>
      <h1 class="demo-title">Podgląd Osadzenia Kalkulatora</h1>
      <p class="demo-desc">Poniższy element działa wewnątrz odizolowanego Shadow DOM, dokładnie tak jak na stronie docelowej.</p>
    </div>

    <!-- Web Component osadzony na stronie -->
    <kitchen-calculator></kitchen-calculator>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
